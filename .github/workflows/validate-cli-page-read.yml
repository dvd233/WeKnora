name: Validate CLI page read errors

on:
  push:
    branches: [validation/weknora-cli-page-read-20261006]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Reviewed source-only commit; full expected tree is checked below.
      CANDIDATE_SHA: 91f886eedf63773366e638bec869bc3ee86f3ae9
      BASELINE_SHA: bccb4b151bae403508da77fbb174efc79dc47c1a
      CANDIDATE_TREE: 4cd6154e4f73d4675b245487b0f46a3953ab2343
    steps:
      - name: Check out validation-only files
        uses: actions/checkout@v6
        with:
          path: validation-config
          persist-credentials: false
      - name: Check out the exact feature commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify source identity and two-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git -C candidate fetch --no-tags --depth=1 https://github.com/Tencent/WeKnora.git "$BASELINE_SHA"
          printf '%s\n' cli/cmd/api/api.go cli/cmd/api/api_test.go > "$RUNNER_TEMP/allowed-paths"
          git -C candidate diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort > "$RUNNER_TEMP/changed-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/changed-paths"
          git -C candidate diff --check "$BASELINE_SHA" "$CANDIDATE_SHA"
          test -z "$(git -C candidate status --porcelain)"
          mkdir baseline
          git -C candidate archive "$BASELINE_SHA" cli client | tar -x -C baseline
          cp candidate/cli/cmd/api/api_test.go baseline/cli/cmd/api/api_test.go
      - name: Acquire the official Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-toolchain" "$RUNNER_TEMP/cli-home" "$RUNNER_TEMP/cli-config"
          curl --fail --location --retry 2 https://go.dev/dl/go1.26.8.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b  $RUNNER_TEMP/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/go-toolchain"
          "$RUNNER_TEMP/go-toolchain/go/bin/go" version
          cat > "$RUNNER_TEMP/run-cli-clean" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec env -i \
            PATH="$RUNNER_TEMP/go-toolchain/go/bin:/usr/bin:/bin" \
            HOME="$RUNNER_TEMP/cli-home" XDG_CONFIG_HOME="$RUNNER_TEMP/cli-config" \
            TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            GOPATH="$RUNNER_TEMP/gopath" GOCACHE="$RUNNER_TEMP/gocache" \
            GOMODCACHE="$RUNNER_TEMP/gomodcache" GOENV=off GOTOOLCHAIN=local GOWORK=off \
            GOFLAGS=-mod=readonly GOPROXY=off GOSUMDB=sum.golang.org \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            "$@"
          SH
          chmod +x "$RUNNER_TEMP/run-cli-clean"
      - name: Acquire and verify public dependencies separately
        shell: bash
        working-directory: candidate/cli
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run-cli-clean" env GOPROXY=https://proxy.golang.org go mod download
          "$RUNNER_TEMP/run-cli-clean" go mod verify
      - name: Validate the fixed CLI
        shell: bash
        working-directory: candidate/cli
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/run-cli-clean" go test ./cmd/api -run TestAPI_Paginate -count=1 -v
          "$RUNNER_TEMP/run-cli-clean" go test ./... -race -count=1
          "$RUNNER_TEMP/run-cli-clean" go vet ./...
          "$RUNNER_TEMP/run-cli-clean" go build ./...
          "$RUNNER_TEMP/run-cli-clean" scripts/check-skill-wire-vocab.sh
          "$RUNNER_TEMP/run-cli-clean" scripts/check-secret-tokens.sh
          test -z "$("$RUNNER_TEMP/run-cli-clean" gofmt -l cmd/api/api.go cmd/api/api_test.go)"
          test -z "$(git status --porcelain)"
      - name: Verify the exact intended baseline failures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          (cd baseline/cli && "$RUNNER_TEMP/run-cli-clean" go test ./cmd/api -run 'TestAPI_Paginate(TruncatedHTTPBody|ReadError)$' -count=1 -json) > "$RUNNER_TEMP/baseline.jsonl" 2> "$RUNNER_TEMP/baseline.stderr"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/baseline.jsonl"
          cat "$RUNNER_TEMP/baseline.stderr"
          test ! -s "$RUNNER_TEMP/baseline.stderr"
          "$RUNNER_TEMP/run-cli-clean" python3 validation-config/validation/weknora-cli-page-read/verify-baseline.py "$RUNNER_TEMP/baseline.jsonl" "$rc"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain)"
